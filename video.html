<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ordo для холдинга – ролик</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
  :root{--navy:#2A2943;--ink:#1F1E33;--soft:#C9C8DA;--lime:#EBF65C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--navy);color:#fff;font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;letter-spacing:-.02em}
  .brand svg{width:34px;height:34px}
  h1{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;text-align:center}
  video{width:min(1100px,100%);aspect-ratio:16/9;border-radius:18px;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  p{margin:0;color:var(--soft);font-size:15px;text-align:center}
  a{color:var(--lime);font-weight:700;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="#FDFDFE"/><circle cx="15" cy="17" r="6.5" fill="none" stroke="#2A2943" stroke-width="3"/><circle cx="22.5" cy="9.5" r="2.6" fill="#B9C42A"/></svg>Ordo</div>
  <h1>Один день холдинга с&nbsp;Ordo</h1>
  <video controls playsinline preload="metadata" poster="media/ordo-holding-poster.jpg">
    <source src="media/ordo-holding.mp4" type="video/mp4">
  </video>
  <p>1:51 · <a href="./">Открыть прототип</a></p>
</body>
</html>
